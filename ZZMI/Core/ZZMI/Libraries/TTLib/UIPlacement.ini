; ============================================================================
; TTLib — on-demand screen-space placement query
;
; Public API (call while the logical object's identifying IB is bound):
;
;   run = CommandList\TTL\RequestUIPlacement
;   ResourceMyPlacement = copy Resource\TTL\UIPlacement
;
; Resource\TTL\UIPlacement is Buffer<float4>[2]:
;   [0].x  valid result (1) or unavailable (0)
;   [0].y  ABI version (1)
;   [1]    screen x, screen y, width, height in physical backbuffer pixels
;
; The answer is normally one frame old. Zero is returned instead of a guess.
; X/Y may be negative when the native UI placement extends off-screen.
; ============================================================================

namespace = TTL

[Constants]
global $ui_placement_frame = 0
global $ui_placement_key = -1
global $ui_placement_pending_count = 0
global $ui_placement_pending_index_1 = -1
global $ui_placement_pending_index_2 = -1
global $ui_placement_pending_index_3 = -1
global $ui_placement_pending_index_4 = -1
global $ui_placement_route_count = 0
global $ui_placement_route_1 = 0
global $ui_placement_route_2 = 0
global $ui_placement_route_3 = 0
global $ui_placement_route_4 = 0
global $ui_placement_index_1 = -1
global $ui_placement_index_2 = -1
global $ui_placement_index_3 = -1
global $ui_placement_index_4 = -1

; Shared public answer. Callers copy it immediately after RequestUIPlacement.
[ResourceUIPlacement]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 2

; FIFO maps the requesting IB identity to a stable record slot. Both pools are
; lazy, so unused entries consume no VRAM and only requested callers allocate.
[PoolUIPlacementCallers]
pool_size = 32
pool_index_type = fifo

[PoolUIPlacementRecords]
pool_size = 32
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 2

; Four vertices are copied only after a tracked RT identity matches. 128 floats
; leave room for UI vertex strides up to 128 bytes without dynamic allocation.
[ResourceUIPlacementQuad]
type = Buffer
format = R32_FLOAT
array = 128
bind_flags = shader_resource

[ResourceUIPlacementRecord]
[ResourceUIPlacementSavedCST0]
[ResourceUIPlacementSavedCSCB0]
[ResourceUIPlacementSavedCSCB1]
[ResourceUIPlacementSavedCSU0]
[ResourceUIPlacementSavedCSU1]

; ---------------------------------------------------------------------------
; Public request: publish the caller's last fresh record, then enqueue its
; stable pool slot. Several callers may request placement in one frame.
; ---------------------------------------------------------------------------

[CommandListRequestUIPlacement]
local $caller = @ib
if $enabled && $caller
    PoolUIPlacementCallers[$caller] = ref ResourceUIPlacement
    $ui_placement_key = #PoolUIPlacementCallers[$caller]
    run = CommandListUIPlacement.Publish

    ; Refresh an already queued caller instead of consuming another slot.
    local $queued = 0
    if $ui_placement_pending_count > 0 && $ui_placement_pending_index_1 == $ui_placement_key
        $queued = 1
    elif $ui_placement_pending_count > 1 && $ui_placement_pending_index_2 == $ui_placement_key
        $queued = 1
    elif $ui_placement_pending_count > 2 && $ui_placement_pending_index_3 == $ui_placement_key
        $queued = 1
    elif $ui_placement_pending_count > 3 && $ui_placement_pending_index_4 == $ui_placement_key
        $queued = 1
    endif

    if !$queued
        if $ui_placement_pending_count == 0
            $ui_placement_pending_index_1 = $ui_placement_key
            $ui_placement_pending_count = 1
        elif $ui_placement_pending_count == 1
            $ui_placement_pending_index_2 = $ui_placement_key
            $ui_placement_pending_count = 2
        elif $ui_placement_pending_count == 2
            $ui_placement_pending_index_3 = $ui_placement_key
            $ui_placement_pending_count = 3
        elif $ui_placement_pending_count == 3
            $ui_placement_pending_index_4 = $ui_placement_key
            $ui_placement_pending_count = 4
        endif
    endif
else
    clear = ResourceUIPlacement 0.0
endif

[CommandListUIPlacement.Publish]
local $saved_x = x94
x94 = $ui_placement_frame
run = CustomShaderUIPlacementPublish
x94 = $saved_x

[CustomShaderUIPlacementPublish]
ResourceUIPlacementSavedCSU0 = ref cs-u0
ResourceUIPlacementSavedCSU1 = ref cs-u1
cs = Shaders\UIPlacementPublish.hlsl
cs-u0 = ResourceUIPlacement
cs-u1 = PoolUIPlacementRecords[$ui_placement_key]
dispatch = 1, 1, 1
post cs-u0 = ref ResourceUIPlacementSavedCSU0
post cs-u1 = ref ResourceUIPlacementSavedCSU1
post ResourceUIPlacementSavedCSU0 = null
post ResourceUIPlacementSavedCSU1 = null

; ---------------------------------------------------------------------------
; Existing TTLib 6443 hook calls this before the native transfer. Characters
; share one scratch target before this point, so resource identity cannot link
; the two passes. Native order is the correlation: each bridge consumes exactly
; one oldest distinct request. A later text/UI bridge sees an empty queue.
; ---------------------------------------------------------------------------

[CommandListUIPlacement.Transfer]
local $target = @o0
local $slot = -1

if $target && $ui_placement_pending_count > 0 && $ui_placement_route_count < 4
    $slot = $ui_placement_pending_index_1
    $ui_placement_pending_index_1 = $ui_placement_pending_index_2
    $ui_placement_pending_index_2 = $ui_placement_pending_index_3
    $ui_placement_pending_index_3 = $ui_placement_pending_index_4
    $ui_placement_pending_index_4 = -1
    $ui_placement_pending_count = $ui_placement_pending_count - 1

    if $ui_placement_route_count == 0
        $ui_placement_route_1 = $target
        $ui_placement_index_1 = $slot
        $ui_placement_route_count = 1
    elif $ui_placement_route_count == 1
        $ui_placement_route_2 = $target
        $ui_placement_index_2 = $slot
        $ui_placement_route_count = 2
    elif $ui_placement_route_count == 2
        $ui_placement_route_3 = $target
        $ui_placement_index_3 = $slot
        $ui_placement_route_count = 3
    elif $ui_placement_route_count == 3
        $ui_placement_route_4 = $target
        $ui_placement_index_4 = $slot
        $ui_placement_route_count = 4
    endif
endif

; ---------------------------------------------------------------------------
; Final UI placement. The exact shader is shared by many UI draws, so the
; route-count guard prevents resource queries until a caller explicitly asks.
; ---------------------------------------------------------------------------

[ShaderOverrideTTLUIPlacement]
; Native final UI presentation-quad VS that places a routed portrait RT.
hash = cdc90aee00e7900d
allow_duplicate_hash = true
if $enabled && $ui_placement_route_count && INDEX_COUNT == 6
    run = CommandListUIPlacement.MeasureMatch
endif

[CommandListUIPlacement.MeasureMatch]
local $source = @ps-t0
local $slot = -1
if $source == $ui_placement_route_1
    $slot = $ui_placement_index_1
elif $ui_placement_route_count > 1 && $source == $ui_placement_route_2
    $slot = $ui_placement_index_2
elif $ui_placement_route_count > 2 && $source == $ui_placement_route_3
    $slot = $ui_placement_index_3
elif $ui_placement_route_count > 3 && $source == $ui_placement_route_4
    $slot = $ui_placement_index_4
endif

if $slot >= 0
    local $stride = vb0->Stride
    if $stride > 0 && $stride <= 128 && $stride % 4 == 0
        ; vb0->Offset is already the absolute FirstVertex byte offset.
        local $offset = vb0->Offset
        ResourceUIPlacementQuad = copy vb0->Region($offset, 4 * $stride)
        ResourceUIPlacementRecord = ref PoolUIPlacementRecords[$slot]
        run = CommandListUIPlacement.Measure
        ResourceUIPlacementRecord = null
    endif
endif

[CommandListUIPlacement.Measure]
local $saved_x = x94
local $saved_y = y94
local $saved_z = z94
local $saved_w = w94
x94 = ResourceUIPlacementQuad->SourceStride / 4
y94 = rt_width
z94 = rt_height
w94 = $ui_placement_frame
run = CustomShaderUIPlacementMeasure
x94 = $saved_x
y94 = $saved_y
z94 = $saved_z
w94 = $saved_w

[CustomShaderUIPlacementMeasure]
ResourceUIPlacementSavedCST0 = ref cs-t0
ResourceUIPlacementSavedCSCB0 = ref cs-cb0
ResourceUIPlacementSavedCSCB1 = ref cs-cb1
ResourceUIPlacementSavedCSU0 = ref cs-u0
cs = Shaders\UIPlacementMeasure.hlsl
cs-cb0 = ref vs-cb2
cs-cb1 = ref vs-cb3
cs-t0 = ResourceUIPlacementQuad
cs-u0 = ref ResourceUIPlacementRecord
dispatch = 1, 1, 1
post cs-t0 = ref ResourceUIPlacementSavedCST0
post cs-cb0 = ref ResourceUIPlacementSavedCSCB0
post cs-cb1 = ref ResourceUIPlacementSavedCSCB1
post cs-u0 = ref ResourceUIPlacementSavedCSU0
post ResourceUIPlacementSavedCST0 = null
post ResourceUIPlacementSavedCSCB0 = null
post ResourceUIPlacementSavedCSCB1 = null
post ResourceUIPlacementSavedCSU0 = null
