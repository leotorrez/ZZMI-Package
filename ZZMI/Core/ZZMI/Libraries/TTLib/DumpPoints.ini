; ============================================================================
; TTL Reforged — optional frame-analysis dump points
; ============================================================================
; This file is diagnostic only. Deleting it removes the capability; the library
; then logs one missing-command-list message per dump point and keeps working.
;
; Usage:
;   $\TTL\debug = 1
;   press the 3DMigoto frame-analysis key (F8 by default) for one frame
;   inspect FrameAnalysis-*/ and set the switch back to 0
;
; `dump` only writes during frame analysis, so leaving the switch on costs a
; branch per frame and nothing else. $\TTL\dump_points is the legacy alias.
;
; What the two points answer:
;   Capture   what the library actually captured for one TTL call, before any
;             consumer ran. This is where a wrong native material pass shows up:
;             a valid layer is white/translucent, an outline pass is flat and
;             opaque. Under several calls per frame the last one wins, so a
;             clean single-call dump means the capture-pass filter is working.
;   Frame     the surviving layer and the final backbuffer at Present, after
;             every consumer had its chance. Compare against Capture to tell a
;             capture defect from a composition or consumer-timing defect.
; ============================================================================

namespace = TTL

; --- One completed capture, immediately after outputs are restored ----------
[CommandListDump.Capture]
dump = ResourceFrontColor
dump = ResourceFrontColor1
dump = ResourceFrontAux
dump = ResourceFrontDepth
dump = ResourceBackColor
dump = ResourceBackColor1
dump = ResourceBackAux
dump = ResourceBackDepth
dump = ResourceTransparencyTex
dump = ResourceSceneDepth
if $has_mesh_mask
    dump = ResourceMeshMaskColor
    dump = ResourceMeshMaskDepth
endif

; --- Present, after every consumer had its chance at the pending layer -------
[CommandListDump.Frame]
dump = ResourceFrontColor
dump = ResourceFrontAux
dump = ResourceBackColor
dump = ResourceBackAux
dump = ResourceSceneDepth
dump = ResourceWorldRTFlip
dump = bb
