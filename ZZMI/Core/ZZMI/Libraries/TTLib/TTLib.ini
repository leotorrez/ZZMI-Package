; ============================================================================
; TTLib 2.3.0 — TransparencyTextureLib Reforged
; Event-latched ZZZ transparency pipeline.
;
; The public namespace is TTL and does not follow the folder or file name:
; callers keep using $\TTL\alpha, Resource\TTL\TransparencyTex and
; CommandList\TTL\Draw exactly as before.
; ============================================================================

namespace = TTL

[Constants]
global locked $version = 2.30
global locked $exists = 1
; Master switch. Call-scoped like the rest of the public API below: reset to
; 1 by CommandListResetCallParams right after every CommandList\TTL\Draw
; invocation, with CommandListFrameReset as a backstop for anything that
; touches it outside of a Draw call. A caller that wants it off across many
; frames must keep re-asserting that every frame (the same pattern any
; persist-cycle hotkey already uses) — do not rely on this staying at a
; caller's value beyond the call or frame that set it.
global $enabled = 1

; Public legacy draw API
global locked $default_alpha = 0.35
global $alpha = $default_alpha
global $_1 = 0
global $_2 = 0
global $_3 = 0
global $use_auto_draw = 0
; Set before run = CommandList\TTL\Draw to route this call through the object
; path (CommandListDraw.ImplObj / the Obj resource set) instead of the
; character path. Read once, synchronously, at the top of CommandListDraw,
; then reset with the rest of the call params — never latched, so there is
; nothing here for a later call to leak.
global $object = 0

; Public material controls
global $H = 0.0
global $S = 1.0
global $V = 1.0
global $mask_channel = 0
global $mask_invert = 0
global $mask_discard_threshold = 0.999
global $color_target = 0
global $back_render = 1
global $depth_mode = 0
global $action = 1

; Layer-scoped snapshot of the public call parameters above, taken once per
; call by CommandListLatchCallParams. Everything that consumes the pending
; layer reads these, not the public variables, because the consumer runs long
; after the caller's command list has returned and the public variables have
; already been reset for the next caller. Add any new public call parameter to
; both this block and CommandListLatchCallParams / CommandListResetCallParams.
global $layer_alpha = $default_alpha
global $layer_H = 0.0
global $layer_S = 1.0
global $layer_V = 1.0
global $layer_mask_channel = 0
global $layer_mask_invert = 0
global $layer_mask_threshold = 0.999
global $layer_color_target = 0
global $layer_back_render = 1
global $layer_depth_mode = 0

; Object variant of the layer-scoped snapshot above, taken by
; CommandListLatchCallParamsObj. World props (crates, doors, terminals...) go
; through their own capture resources and their own pending layer entirely
; (see CommandListObject / CommandListDraw.ImplObj and the *Obj command lists
; below) so that an object pending layer can never share a buffer, or a
; latched parameter, with a character's pending layer that happens to still
; be open in the same frame.
global $layer_obj_alpha = $default_alpha
global $layer_obj_H = 0.0
global $layer_obj_S = 1.0
global $layer_obj_V = 1.0
global $layer_obj_mask_channel = 0
global $layer_obj_mask_invert = 0
global $layer_obj_mask_threshold = 0.999
global $layer_obj_color_target = 0
global $layer_obj_back_render = 1
global $layer_obj_depth_mode = 0

; Public mesh-mask API
global $has_mesh_mask = 0
global $mesh_mask_ready = 0
global $mesh_mask_replace = 0
global $m_n = 0
global $m1c = 0
global $m1f = 0
global $m2c = 0
global $m2f = 0
global $m3c = 0
global $m3f = 0
global $m4c = 0
global $m4f = 0

; Compatibility controls retained for old mods. They are intentionally cheap.
global $layout_hijack = 0
global $layout_debug = 0
global $content_filter = 0
global $content_min_sim = 0.85
global $min_ui_luma = 0.08
global $slot_id = 0
global $slot_enable = 0
global $dump_points = 0
global $drawn = 1

; Fail-closed by default. With no verified consumer for the pending layer,
; do not stretch a portrait-sized texture over the backbuffer.
global $present_fallback = 0
; The late world backend measures orientation per draw, so a manual vertical
; flip should never be required. Retained for callers that set it.
global $openworld_flip_y = 0
; Re-point SceneDepth at the live game depth target on a rejected pass. The
; body is drawn during those passes and Batch.Pre, the only other SceneDepth
; writer, does not run when a call is dropped. This is a reference, not a copy:
; consumers therefore read the depth target's contents as of application time,
; which is what occlusion against the already-drawn body needs.
global $touch_depth_on_drop = 1

; Internal state
global $internal_control = 0
global $has_pending_layer = 0
global $capture_width = 0
global $capture_height = 0
global $diag_captures = 0
global $diag_openworld = 0
global $diag_ui = 0
global $diag_fallback = 0
global $frame_capture = 0
global $frame_openworld = 0
global $frame_late_world = 0
global $frame_ui = 0
global $frame_agent_select = 0
global $frame_ui_6443 = 0
global $frame_fallback = 0
global $frame_reject_outline = 0
global $frame_reject_edge_case = 0
global $edge_case_skip_capture = 0
global $agent_select_context = 0
global $agent_select_resolve_probe = 0
global $agent_select_resolve_ready = 0

; Object pending layer. Deliberately separate from $has_pending_layer /
; $capture_width / $capture_height above — see the layer_obj_* block in
; [Constants].
global $has_pending_layer_obj = 0
global $capture_width_obj = 0
global $capture_height_obj = 0
global $diag_captures_obj = 0
global $frame_capture_obj = 0

; IniParams backups used only around TTL custom draws.
global $bak_w69 = 0
global $bak_x72 = 0
global $bak_x73 = 0
global $bak_y73 = 0
global $bak_z73 = 0
global $bak_x95 = 0
global $bak_y95 = 0
global $bak_x99 = 0
global $bak_y99 = 0
global $bak_z99 = 0
global $bak_x100 = 0

; ---------------------------------------------------------------------------
; Frame lifecycle
; ---------------------------------------------------------------------------

[Present]
if $enabled && $present_fallback && ($has_pending_layer || $has_pending_layer_obj)
    run = CommandListApplyPresentFallback
endif
post run = CommandListFrameReset
post clear = ResourceWorldRTFlip 0.0

[CommandListFrameReset]
$ui_placement_frame = ($ui_placement_frame + 1) % 16777216
$ui_placement_pending_count = 0
$ui_placement_route_count = 0
; Backstop for the master switch: CommandListResetCallParams already clears
; it right after every Draw call, but this covers a mod that sets it and
; never calls Draw at all in the same frame. Not a persistent session
; setting — a caller that wants it off across many frames must keep
; re-asserting that every frame anyway (the same pattern any persist-cycle
; hotkey already uses), so this reset cannot break a real toggle.
$enabled = 1
$_1 = 0
$_2 = 0
$_3 = 0
$alpha = $default_alpha
$H = 0.0
$S = 1.0
$V = 1.0
$mask_channel = 0
$mask_invert = 0
$mask_discard_threshold = 0.999
$color_target = 0
$back_render = 1
$depth_mode = 0
$object = 0
$internal_control = 0
$has_pending_layer = 0
$has_pending_layer_obj = 0
$has_mesh_mask = 0
$mesh_mask_ready = 0
$drawn = 1
$m_n = 0
ResourceTransparencyTex = null
ResourceSavedT69 = null
$frame_capture = 0
$frame_capture_obj = 0
$frame_openworld = 0
$frame_late_world = 0
$frame_ui = 0
$frame_agent_select = 0
$frame_ui_6443 = 0
$frame_fallback = 0
$frame_reject_outline = 0
$frame_reject_edge_case = 0
$agent_select_context = 0
$agent_select_resolve_probe = 0
$agent_select_resolve_ready = 0

; ---------------------------------------------------------------------------
; Stable public API
; ---------------------------------------------------------------------------

; $object routes this call to the object path (CommandListDraw.ImplObj — its
; own capture resources, its own pending layer, no outline gate) instead of
; the character path (CommandListDraw.Impl, untouched by any of this). Read
; once here, synchronously, before the reset below clears it along with the
; rest of the call params — see the $object comment in [Constants].
;
; The reset runs unconditionally, once per invocation of this command list,
; regardless of which branch below fires. $enabled itself is one of the
; things it clears (see CommandListResetCallParams): checking it gates
; whether this call captures, but reading it here does not let it leak to
; whatever the next caller in this frame expects it to be.
[CommandListDraw]
if $enabled
    if $_1 || $use_auto_draw
        if $object
            run = CommandListDraw.ImplObj
        else
            run = CommandListDraw.Impl
        endif
    endif
else
    ; TTL disabled: fall back to an ordinary native draw instead of the
    ; object vanishing outright. Same draw args, whatever render target and
    ; blend state the call site already has bound — no capture, no
    ; compositing, just the plain geometry.
    if $_1 || $use_auto_draw
        run = CommandListDrawIndexedAutoOrArgs
    endif
endif
run = CommandListResetCallParams

[CommandListD]
run = CommandListDraw

[CommandListTransparency]
run = CommandListDraw

[CommandListT]
run = CommandListDraw

[CommandListComponent]
run = CommandListDraw
run = CommandListClearDrawArgs

[CommandListC]
run = CommandListComponent

; Call params are reset by the caller (CommandListDraw) once this returns,
; not here — that way the reset also covers the disabled-fallback and no-op
; branches in CommandListDraw that never reach this section at all.
[CommandListDraw.Impl]
; Self-healing SetTextures: SlotFix\saved_main is the same flag SlotFix uses
; internally to avoid double-saving ps-t0..t9 — it is 1 for the rest of this
; draw call once CommandList\ZZMI\SetTextures has run, 0 otherwise. TTL is
; already SlotFix-dependent (the classification below reads $\SlotFix\* too),
; so reading one more of its public flags adds no new dependency. A caller
; that forgot SetTextures gets it invoked here instead of silently losing
; classification and texture rebinding; a caller that already called it pays
; nothing extra, since the flag is already 1 and this is skipped.
if $\SlotFix\saved_main != 1
    run = CommandList\ZZMI\SetTextures
endif
$edge_case_skip_capture = 0
run = CommandListGameHooks.Classify
if $action == 0
    run = CommandListDrop
; Edge-case suppression is intentionally silent: unlike CommandListDrop it must
; not point SceneDepth at a shadow/depth-pass oD.
elif $edge_case_skip_capture
    $frame_reject_edge_case = 1
; elif $\SlotFix\is_outline_shader
elif !$\SlotFix\is_color_shader
    $frame_reject_outline = 1
    run = CommandListDrop
else
    run = CommandListCaptureLegacyDraw
endif

; Object variant of Draw.Impl above. No outline gate: SlotFix classifies
; character material slots, not world props, so that check has nothing to
; read for an object call. Captures through CommandListCaptureObjectDraw
; instead of CommandListCaptureLegacyDraw, into the Obj resource set. Call
; params are reset by the caller (CommandListDraw), not here — see there.
[CommandListDraw.ImplObj]
$edge_case_skip_capture = 0
run = CommandListGameHooks.Classify
if $action == 0
    run = CommandListDrop
elif $edge_case_skip_capture
    $frame_reject_edge_case = 1
else
    run = CommandListCaptureObjectDraw
endif

; A dropped call must not capture, but it must still keep depth current: the
; game draws the body during the passes TTL rejects, and Agent Select issues the
; garment Draw before that body redraw.
[CommandListDrop]
; copy, not ref: confirmed by frame analysis (2026-09-15) that the game
; clears/reuses this exact depth-stencil object for something unrelated
; between this touch and consumption — a ref faithfully follows that clear
; and hands BuildLayer an all-zero depth, which is worse than stale data
; (stale at least still occludes correctly for anything drawn before this
; point). copy is the known-expensive fallback until someone finds the
; actual clear event to hook after instead.
; TODO: find a way to go back to `ref` here without losing data across
; paths — i.e. locate whatever clears/reuses this depth-stencil object
; between CommandListDrop and consumption, and refresh SceneDepth from a
; point after that clear instead of copying defensively on every touch.
if $enabled && $touch_depth_on_drop
    ResourceSceneDepth = copy oD unless_null
endif

[CommandListExcept]
run = CommandListDrop

; Advanced batching API. Create/Destroy save and restore the game outputs once.
; Custom library users may call Prepare.F / Prepare.B / Prepare.Mask.F / .B
; between them and issue their own drawindexed/drawindexedinstanced commands.
[CommandListCreate]
run = CommandListLatchCallParams
run = CommandListPushParams
run = CommandListApplyParams
run = CommandListBindTransparencyTex
run = CommandListBatch.Pre

[CommandListDestroy]
run = CommandListBatch.Post
run = CommandListRestoreT69
run = CommandListPopParams

; See the layer-scoped block in [Constants] for why this exists. Latching
; happens here rather than at the point of use because this is the only place
; that still knows the values are this call's: by the time a consumer runs,
; $alpha and friends may already belong to whatever mod called TTL next.
[CommandListLatchCallParams]
$layer_alpha = $alpha
$layer_H = $H
$layer_S = $S
$layer_V = $V
$layer_mask_channel = $mask_channel
$layer_mask_invert = $mask_invert
$layer_mask_threshold = $mask_discard_threshold
$layer_color_target = $color_target
$layer_back_render = $back_render
$layer_depth_mode = $depth_mode

; Object counterpart of CommandListLatchCallParams above, snapshotting into
; the layer_obj_* set instead so an object capture can never overwrite the
; parameters a still-pending character layer will read at consumption time
; (and vice versa).
[CommandListLatchCallParamsObj]
$layer_obj_alpha = $alpha
$layer_obj_H = $H
$layer_obj_S = $S
$layer_obj_V = $V
$layer_obj_mask_channel = $mask_channel
$layer_obj_mask_invert = $mask_invert
$layer_obj_mask_threshold = $mask_discard_threshold
$layer_obj_color_target = $color_target
$layer_obj_back_render = $back_render
$layer_obj_depth_mode = $depth_mode

; Returns the public parameters to their declared defaults. Safe to do right
; away rather than waiting for the layer to be consumed: their data has already
; been latched, so nothing downstream reads the public variable again. Run
; unconditionally by CommandListDraw once per invocation — captured, dropped,
; disabled-fallback or no-op alike — so none of these can leak into whatever
; the next caller in this frame expects them to default to. $enabled is
; included for the same reason $object is: it is read once at the top of
; CommandListDraw to decide this call's routing, and must not survive past
; that decision for anyone else to inherit.
[CommandListResetCallParams]
$enabled = 1
$alpha = $default_alpha
$H = 0.0
$S = 1.0
$V = 1.0
$mask_channel = 0
$mask_invert = 0
$mask_discard_threshold = 0.999
$color_target = 0
$back_render = 1
$depth_mode = 0
$object = 0

[CommandListBatch.Pre]
if $enabled && !$internal_control
    run = CommandListEnsureCaptureTargets
    if ResourceFrontColor !== null
        run = CommandListPublishLegacyResources
        if !$has_pending_layer
            run = CommandListBeginPendingLayer
        endif
        ; copy, not ref — see the TODO/comment on the same line in
        ; CommandListDrop: the game clears/reuses this depth-stencil object
        ; for something unrelated before consumption, and ref would hand
        ; BuildLayer that clear (all zeros) instead of real depth.
        ResourceSceneDepth = copy oD unless_null
        run = CommandListBackupOutputs
        $internal_control = 1
    endif
endif

[CommandListBatch.Post]
if $internal_control
    run = BuiltInCommandListUnbindAllRenderTargets
    run = CommandListRestoreOutputs
    $internal_control = 0
endif

; Object counterpart of CommandListBatch.Pre. $internal_control and the
; ResourceSavedO*/OD backups are safe to share with the character path: both
; are purely transient within one synchronous Batch.Pre..Batch.Post span, and
; draws are processed one at a time, so the two paths never have a span open
; at once. CommandListBatch.Post above is reused as-is for the same reason.
[CommandListBatch.PreObj]
if $enabled && !$internal_control
    run = CommandListEnsureCaptureTargetsObj
    if ResourceFrontColorObj !== null
        if !$has_pending_layer_obj
            run = CommandListBeginPendingLayerObj
        endif
        ResourceSceneDepth = ref oD unless_null
        run = CommandListBackupOutputs
        $internal_control = 1
    endif
endif

[CommandListCaptureLegacyDraw]
run = CommandListLatchCallParams
run = CommandListPushParams
run = CommandListApplyParams
run = CommandListBindTransparencyTex
run = CommandListBatch.Pre

if $internal_control
    if $layer_back_render
        run = CustomShaderCaptureBack
        run = CustomShaderCaptureMaskBack
    endif
    run = CustomShaderCaptureFront
    run = CustomShaderCaptureMaskFront
    $diag_captures = $diag_captures + 1
    $frame_capture = 1
endif

run = CommandListBatch.Post
run = CommandListRestoreT69
run = CommandListPopParams

; Object counterpart of CommandListCaptureLegacyDraw above. Captures into the
; Obj resource set via the Obj shader wrappers, gated by the Obj pending
; layer, so this can run interleaved with a still-open character capture
; without touching any of its state.
[CommandListCaptureObjectDraw]
run = CommandListLatchCallParamsObj
run = CommandListPushParams
run = CommandListApplyParamsObj
run = CommandListBindTransparencyTex
run = CommandListBatch.PreObj

if $internal_control
    if $layer_obj_back_render
        run = CustomShaderCaptureBackObj
        run = CustomShaderCaptureMaskBackObj
    endif
    run = CustomShaderCaptureFrontObj
    run = CustomShaderCaptureMaskFrontObj
    $diag_captures_obj = $diag_captures_obj + 1
    $frame_capture_obj = 1
endif

run = CommandListBatch.Post
run = CommandListRestoreT69
run = CommandListPopParams

; TransparencyTex is a public API resource. Legacy character mods assign it
; directly, while CaptureMask samples t69. Preserve the game's original t69,
; bind the public resource for the TTL draw, then restore the original binding.
; Explicitly null t69 when no mask is supplied so uniform $alpha remains the
; deterministic fallback instead of accidentally sampling an unrelated game SRV.
[CommandListBindTransparencyTex]
ResourceSavedT69 = null
ResourceSavedT69 = ref ps-t69
if ResourceTransparencyTex !== null
    ps-t69 = ref ResourceTransparencyTex
else
    ps-t69 = null
endif

[CommandListRestoreT69]
if ResourceSavedT69 !== null
    ps-t69 = ref ResourceSavedT69
else
    ps-t69 = null
endif
ResourceSavedT69 = null

[CommandListPublishLegacyResources]
ResourceFakeo0.F = ref ResourceFrontColor
ResourceFakeo1.F = ref ResourceFrontColor1
ResourceFakeo6.F = ref ResourceFrontAux
ResourceFakeoD.F = ref ResourceFrontDepth
ResourceFakeo0.B = ref ResourceBackColor
ResourceFakeo1.B = ref ResourceBackColor1
ResourceFakeo6.B = ref ResourceBackAux
ResourceFakeoD.B = ref ResourceBackDepth

; ---------------------------------------------------------------------------
; Capture setup
; ---------------------------------------------------------------------------

[CommandListEnsureCaptureTargets]
if rt_width != $capture_width || rt_height != $capture_height
    $capture_width = rt_width
    $capture_height = rt_height
    ResourceFrontColor = null
    ResourceFrontColor1 = null
    ResourceFrontAux = null
    ResourceFrontDepth = null
    ResourceBackColor = null
    ResourceBackColor1 = null
    ResourceBackAux = null
    ResourceBackDepth = null
    ResourceSceneDepth = null
    ResourceMeshMaskDepth = null
    ResourceMeshMaskColor = null
    $has_pending_layer = 0
    $has_mesh_mask = 0
    $mesh_mask_ready = 0
endif

if ResourceFrontColor === null
    ResourceFrontColor = copy_desc o0 unless_null
    ResourceFrontColor1 = copy_desc o1 unless_null
    ResourceFrontAux = copy_desc o0 unless_null
    ResourceFrontDepth = copy_desc oD unless_null
    ResourceBackColor = copy_desc o0 unless_null
    ResourceBackColor1 = copy_desc o1 unless_null
    ResourceBackAux = copy_desc o0 unless_null
    ResourceBackDepth = copy_desc oD unless_null
endif
if $layer_color_target == 1 && ResourceFrontColor1 === null
    ResourceFrontColor1 = copy_desc o1 unless_null
    ResourceBackColor1 = copy_desc o1 unless_null
endif

[CommandListBeginPendingLayer]
clear = ResourceFrontColor
clear = ResourceFrontColor1
clear = ResourceFrontAux
clear = ResourceFrontDepth 0.0
clear = ResourceBackColor
clear = ResourceBackColor1
clear = ResourceBackAux
clear = ResourceBackDepth 0.0
$has_pending_layer = 1
$drawn = 0

; Object counterparts of CommandListEnsureCaptureTargets / BeginPendingLayer
; above. Own resize tracking, own resources, own pending-layer flag — nothing
; here is read or written by the character path.
[CommandListEnsureCaptureTargetsObj]
if rt_width != $capture_width_obj || rt_height != $capture_height_obj
    $capture_width_obj = rt_width
    $capture_height_obj = rt_height
    ResourceFrontColorObj = null
    ResourceFrontColor1Obj = null
    ResourceFrontAuxObj = null
    ResourceFrontDepthObj = null
    ResourceBackColorObj = null
    ResourceBackColor1Obj = null
    ResourceBackAuxObj = null
    ResourceBackDepthObj = null
    $has_pending_layer_obj = 0
endif

if ResourceFrontColorObj === null
    ResourceFrontColorObj = copy_desc o0 unless_null
    ResourceFrontColor1Obj = copy_desc o1 unless_null
    ResourceFrontAuxObj = copy_desc o0 unless_null
    ResourceFrontDepthObj = copy_desc oD unless_null
    ResourceBackColorObj = copy_desc o0 unless_null
    ResourceBackColor1Obj = copy_desc o1 unless_null
    ResourceBackAuxObj = copy_desc o0 unless_null
    ResourceBackDepthObj = copy_desc oD unless_null
endif
if $layer_obj_color_target == 1 && ResourceFrontColor1Obj === null
    ResourceFrontColor1Obj = copy_desc o1 unless_null
    ResourceBackColor1Obj = copy_desc o1 unless_null
endif

[CommandListBeginPendingLayerObj]
clear = ResourceFrontColorObj
clear = ResourceFrontColor1Obj
clear = ResourceFrontAuxObj
clear = ResourceFrontDepthObj 0.0
clear = ResourceBackColorObj
clear = ResourceBackColor1Obj
clear = ResourceBackAuxObj
clear = ResourceBackDepthObj 0.0
$has_pending_layer_obj = 1

[CustomShaderCaptureFront]
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.F
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.F]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontColor
o1 = ref ResourceFrontColor1
oD = ref ResourceFrontDepth

[CustomShaderCaptureBack]
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.B
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.B]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceBackColor
o1 = ref ResourceBackColor1
oD = ref ResourceBackDepth

[CustomShaderCaptureMaskFront]
ps = Shaders\CaptureMask.hlsl
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.Mask.F
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.Mask.F]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontAux
oD = ref ResourceFrontDepth

[CustomShaderCaptureMaskBack]
ps = Shaders\CaptureMask.hlsl
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.Mask.B
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.Mask.B]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceBackAux
oD = ref ResourceBackDepth

; Object counterparts of the four capture shader wrappers above, writing into
; the Obj resource set instead.
[CustomShaderCaptureFrontObj]
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.F.Obj
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.F.Obj]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontColorObj
o1 = ref ResourceFrontColor1Obj
