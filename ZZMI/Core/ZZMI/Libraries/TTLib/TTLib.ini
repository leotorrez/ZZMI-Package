[CustomShaderCaptureBackObj]
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.B.Obj
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.B.Obj]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceBackColorObj
o1 = ref ResourceBackColor1Obj
oD = ref ResourceBackDepthObj

[CustomShaderCaptureMaskFrontObj]
ps = Shaders\CaptureMask.hlsl
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.Mask.F.Obj
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.Mask.F.Obj]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontAuxObj
