        $has_pending_layer = 0
        $has_mesh_mask = 0
        $mesh_mask_ready = 0
        $drawn = 1
        $diag_ui = $diag_ui + 1
        $frame_ui = 1
        $frame_ui_6443 = 1
    endif
    ResourceUITarget = null
endif

