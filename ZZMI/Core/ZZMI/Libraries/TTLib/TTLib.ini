; ============================================================================
; TTLib 2.1 — TransparencyTextureLib Reforged
; Event-latched ZZZ transparency pipeline.
;
; The public namespace is TTL and does not follow the folder or file name:
; callers keep using $\TTL\alpha, Resource\TTL\TransparencyTex and
; CommandList\TTL\Draw exactly as before.
; ============================================================================

namespace = TTL

[Constants]
global locked $version = 2.1
global locked $exists = 1
global $enabled = 1

; Public legacy draw API
global $alpha = 1.0
global $_1 = 0
global $_2 = 0
global $_3 = 0
global $use_auto_draw = 0

; Public material controls
global $H = 0.0
global $S = 1.0
global $V = 1.0
global $mask_channel = 0
global $mask_invert = 0
global $mask_discard_threshold = 0.999
global $color_target = 0
global $back_render = 1
global $depth_mode = 0
global $action = 1

; Public mesh-mask API
global $has_mesh_mask = 0
global $mesh_mask_ready = 0
global $mesh_mask_replace = 0
global $m_n = 0
global $m1c = 0
global $m1f = 0
global $m2c = 0
global $m2f = 0
global $m3c = 0
global $m3f = 0
global $m4c = 0
global $m4f = 0

; Compatibility controls retained for old mods. They are intentionally cheap.
global $layout_hijack = 0
global $layout_debug = 0
global $content_filter = 0
global $content_min_sim = 0.85
global $min_ui_luma = 0.08
global $slot_id = 0
global $slot_enable = 0
global $dump_points = 0
global $drawn = 1

; моя дебаг хуйня
global $present_fallback = 0
global $openworld_flip_y = 0
; Refresh SceneDepth from the live game depth target on a rejected pass. The
; body is drawn during those passes and Batch.Pre, the only other SceneDepth
; writer, does not run when a call is dropped.
global $touch_depth_on_drop = 1
global $debug = 0

; Internal state
global $internal_control = 0
global $has_pending_layer = 0
global $capture_width = 0
global $capture_height = 0
global $diag_captures = 0
global $diag_openworld = 0
global $diag_ui = 0
global $diag_fallback = 0
global $frame_capture = 0
global $frame_openworld = 0
global $frame_late_world = 0
global $frame_ui = 0
global $frame_agent_select = 0
global $frame_ui_6443 = 0
global $frame_fallback = 0
global $frame_reject_outline = 0
global $frame_reject_edge_case = 0
global $edge_case_skip_capture = 0
global $agent_select_context = 0
global $agent_select_resolve_probe = 0
global $agent_select_resolve_ready = 0

; IniParams backups used only around TTL custom draws.
global $bak_w69 = 0
global $bak_x72 = 0
global $bak_x73 = 0
global $bak_y73 = 0
global $bak_z73 = 0
global $bak_x95 = 0
global $bak_y95 = 0
global $bak_x99 = 0
global $bak_y99 = 0
global $bak_z99 = 0
global $bak_x100 = 0

; ---------------------------------------------------------------------------
; Frame lifecycle
; ---------------------------------------------------------------------------

[Present]
if $enabled && $present_fallback && $has_pending_layer
    run = CommandListApplyPresentFallback
endif
if $debug || $dump_points
    run = CommandListDump.Frame
endif
post run = CommandListFrameReset
post clear = ResourceWorldRTFlip 0.0

[CommandListFrameReset]
$ui_placement_frame = ($ui_placement_frame + 1) % 16777216
$ui_placement_pending_count = 0
$ui_placement_route_count = 0
$_1 = 0
$_2 = 0
$_3 = 0
$alpha = 0.0
$H = 0.0
$S = 1.0
$V = 1.0
$internal_control = 0
$has_pending_layer = 0
$has_mesh_mask = 0
$mesh_mask_ready = 0
$drawn = 1
$m_n = 0
ResourceTransparencyTex = null
ResourceSavedT69 = null
$frame_capture = 0
$frame_openworld = 0
$frame_late_world = 0
$frame_ui = 0
$frame_agent_select = 0
$frame_ui_6443 = 0
$frame_fallback = 0
$frame_reject_outline = 0
$frame_reject_edge_case = 0
$agent_select_context = 0
$agent_select_resolve_probe = 0
$agent_select_resolve_ready = 0

; ---------------------------------------------------------------------------
; Stable public API
; ---------------------------------------------------------------------------

[CommandListDraw]
if $enabled
    if $_1 || $use_auto_draw
        run = CommandListDraw.Impl
    endif
endif

[CommandListD]
run = CommandListDraw

[CommandListTransparency]
run = CommandListDraw

[CommandListT]
run = CommandListDraw

[CommandListComponent]
run = CommandListDraw
run = CommandListClearDrawArgs

[CommandListC]
run = CommandListComponent

[CommandListDraw.Impl]
$edge_case_skip_capture = 0
run = CommandListFckngEdgeCases.Classify
if $action == 0
    run = CommandListDrop
; Edge-case suppression is intentionally silent: unlike CommandListDrop it must
; not copy a shadow/depth-pass oD into the scene-depth snapshot.
elif $edge_case_skip_capture
    $frame_reject_edge_case = 1
elif $\SlotFix\is_outline_shader
    $frame_reject_outline = 1
    run = CommandListDrop
else
    run = CommandListCaptureLegacyDraw
endif

; A dropped call must not capture, but it must still keep depth current: the
; game draws the body during the passes TTL rejects, and Agent Select issues the
; garment Draw before that body redraw.
[CommandListDrop]
if $enabled && $touch_depth_on_drop
    ResourceSceneDepth = ref oD unless_null
endif

[CommandListExcept]
run = CommandListDrop

; Advanced batching API. Create/Destroy save and restore the game outputs once.
; Custom library users may call Prepare.F / Prepare.B / Prepare.Mask.F / .B
; between them and issue their own drawindexed/drawindexedinstanced commands.
[CommandListCreate]
run = CommandListPushParams
run = CommandListApplyParams
run = CommandListBindTransparencyTex
run = CommandListBatch.Pre

[CommandListDestroy]
run = CommandListBatch.Post
run = CommandListRestoreT69
run = CommandListPopParams

[CommandListBatch.Pre]
if $enabled && !$internal_control
    run = CommandListEnsureCaptureTargets
    if ResourceFrontColor !== null
        run = CommandListPublishLegacyResources
        if !$has_pending_layer
            run = CommandListBeginPendingLayer
        endif
        ResourceSceneDepth = ref oD unless_null
        run = CommandListBackupOutputs
        $internal_control = 1
    endif
endif

[CommandListBatch.Post]
if $internal_control
    run = BuiltInCommandListUnbindAllRenderTargets
    run = CommandListRestoreOutputs
    $internal_control = 0
endif

[CommandListCaptureLegacyDraw]
run = CommandListPushParams
run = CommandListApplyParams
run = CommandListBindTransparencyTex
run = CommandListBatch.Pre

if $internal_control
    if $back_render
        run = CustomShaderCaptureBack
        run = CustomShaderCaptureMaskBack
    endif
    run = CustomShaderCaptureFront
    run = CustomShaderCaptureMaskFront
    $diag_captures = $diag_captures + 1
    $frame_capture = 1
endif

run = CommandListBatch.Post
run = CommandListRestoreT69
run = CommandListPopParams

if $debug || $dump_points
    run = CommandListDump.Capture
endif

; TransparencyTex is a public API resource. Legacy character mods assign it
; directly, while CaptureMask samples t69. Preserve the game's original t69,
; bind the public resource for the TTL draw, then restore the original binding.
; Explicitly null t69 when no mask is supplied so uniform $alpha remains the
; deterministic fallback instead of accidentally sampling an unrelated game SRV.
[CommandListBindTransparencyTex]
ResourceSavedT69 = null
ResourceSavedT69 = ref ps-t69
if ResourceTransparencyTex !== null
    ps-t69 = ref ResourceTransparencyTex
else
    ps-t69 = null
endif

[CommandListRestoreT69]
if ResourceSavedT69 !== null
    ps-t69 = ref ResourceSavedT69
else
    ps-t69 = null
endif
ResourceSavedT69 = null

[CommandListPublishLegacyResources]
ResourceFakeo0.F = ref ResourceFrontColor
ResourceFakeo1.F = ref ResourceFrontColor1
ResourceFakeo6.F = ref ResourceFrontAux
ResourceFakeoD.F = ref ResourceFrontDepth
ResourceFakeo0.B = ref ResourceBackColor
ResourceFakeo1.B = ref ResourceBackColor1
ResourceFakeo6.B = ref ResourceBackAux
ResourceFakeoD.B = ref ResourceBackDepth

[CommandListClear]

; ---------------------------------------------------------------------------
; Capture setup
; ---------------------------------------------------------------------------

[CommandListEnsureCaptureTargets]
if rt_width != $capture_width || rt_height != $capture_height
    $capture_width = rt_width
    $capture_height = rt_height
    ResourceFrontColor = null
    ResourceFrontColor1 = null
    ResourceFrontAux = null
    ResourceFrontDepth = null
    ResourceBackColor = null
    ResourceBackColor1 = null
    ResourceBackAux = null
    ResourceBackDepth = null
    ResourceSceneDepth = null
    ResourceMeshMaskDepth = null
    ResourceMeshMaskColor = null
    $has_pending_layer = 0
    $has_mesh_mask = 0
    $mesh_mask_ready = 0
endif

if ResourceFrontColor === null
    ResourceFrontColor = copy_desc o0 unless_null
    ResourceFrontColor1 = copy_desc o1 unless_null
    ResourceFrontAux = copy_desc o0 unless_null
    ResourceFrontDepth = copy_desc oD unless_null
    ResourceBackColor = copy_desc o0 unless_null
    ResourceBackColor1 = copy_desc o1 unless_null
    ResourceBackAux = copy_desc o0 unless_null
    ResourceBackDepth = copy_desc oD unless_null
endif
if $color_target == 1 && ResourceFrontColor1 === null
    ResourceFrontColor1 = copy_desc o1 unless_null
    ResourceBackColor1 = copy_desc o1 unless_null
endif

[CommandListBeginPendingLayer]
clear = ResourceFrontColor
clear = ResourceFrontColor1
clear = ResourceFrontAux
clear = ResourceFrontDepth 0.0
clear = ResourceBackColor
clear = ResourceBackColor1
clear = ResourceBackAux
clear = ResourceBackDepth 0.0
$has_pending_layer = 1
$drawn = 0

[CustomShaderCaptureFront]
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.F
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.F]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontColor
o1 = ref ResourceFrontColor1
oD = ref ResourceFrontDepth

[CustomShaderCaptureBack]
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.B
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.B]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceBackColor
o1 = ref ResourceBackColor1
oD = ref ResourceBackDepth

[CustomShaderCaptureMaskFront]
ps = Shaders\CaptureMask.hlsl
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.Mask.F
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.Mask.F]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFrontAux
oD = ref ResourceFrontDepth

[CustomShaderCaptureMaskBack]
ps = Shaders\CaptureMask.hlsl
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.Mask.B
run = CommandListDrawIndexedAutoOrArgs

[CommandListPrepare.Mask.B]
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceBackAux
oD = ref ResourceBackDepth

; ---------------------------------------------------------------------------
; Draw helpers
; ---------------------------------------------------------------------------

[CommandListDrawIndexedAutoOrArgs]
if $_1
    run = CommandListDrawFromVars
elif $use_auto_draw
    if INSTANCE_COUNT > 0
        drawindexedinstanced = auto
    else
        drawindexed = auto
    endif
endif

[CommandListDrawFromVars]
local $instances = INSTANCE_COUNT
$instances = ($instances == 0) + $instances
drawindexedinstanced = $_1, $instances, $_2, $_3, FIRST_INSTANCE

[CommandListClearDrawArgs]
$_1 = 0
$_2 = 0
$_3 = 0

; ---------------------------------------------------------------------------
; Mesh depth mask compatibility API
; ---------------------------------------------------------------------------

[CommandListDepthMask]
if $enabled
    if $_1 || $use_auto_draw
        run = CommandListDepthMask.Stamp
        run = CommandListClearDrawArgs
    endif
endif

[CommandListMask]
run = CommandListDepthMask

[CommandListMeshMask]
run = CommandListDepthMask

[CommandListDM]
run = CommandListDepthMask

[CommandListSolidMask]
if $enabled && $_1
    run = CommandListDrawFromVars
    run = CommandListDepthMask.Stamp
    run = CommandListClearDrawArgs
endif

[CommandListSM]
run = CommandListSolidMask

[CommandListMaskBatch]
if $enabled
    if $m_n >= 1
        $_1 = $m1c
        $_2 = $m1f
        run = CommandListDepthMask.Stamp
    endif
    if $m_n >= 2
        $_1 = $m2c
        $_2 = $m2f
        run = CommandListDepthMask.Stamp
    endif
    if $m_n >= 3
        $_1 = $m3c
        $_2 = $m3f
        run = CommandListDepthMask.Stamp
    endif
    if $m_n >= 4
        $_1 = $m4c
        $_2 = $m4f
        run = CommandListDepthMask.Stamp
    endif
    $m_n = 0
    run = CommandListClearDrawArgs
endif

[CommandListMB]
run = CommandListMaskBatch

[CommandListDepthMask.Stamp]
run = CommandListEnsureCaptureTargets
if ResourceMeshMaskDepth === null
    ResourceMeshMaskDepth = copy_desc oD unless_null
    ResourceMeshMaskColor = copy_desc o0 unless_null
endif
if ResourceMeshMaskDepth !== null
    if !$mesh_mask_ready
        clear = ResourceMeshMaskDepth 0.0
        clear = ResourceMeshMaskColor
        $mesh_mask_ready = 1
    endif
    run = CommandListBackupOutputs
    run = CustomShaderDepthMask
    run = BuiltInCommandListUnbindAllRenderTargets
    run = CommandListRestoreOutputs
    $has_mesh_mask = 1
endif

[CustomShaderDepthMask]
cull = back
front = CounterClockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = all
depth_func = greater_equal
stencil_enable = false
blend = ADD ZERO ONE
alpha = ADD ZERO ONE
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceMeshMaskColor
oD = ref ResourceMeshMaskDepth
run = CommandListDrawIndexedAutoOrArgs

; ---------------------------------------------------------------------------
; Native consumers: pending layer is consumed exactly once.
; ---------------------------------------------------------------------------

; Late world backend. This semantic VS fingerprint covers the final 3D transfer
; used by 1da in the reference build without depending on that PS hash. The VS
; is reused earlier and in menus, so runtime guards require the final transfer's
; indexed quad, bound depth target and six PS inputs. Running after the native
; draw places TTL after the world effect chain but before UI.
[ShaderRegexTTLLateWorldTransfer]
shader_model = vs_4_0
run = CommandListProbeLateWorldFlip
post run = CommandListProbeLateWorldTransfer

; [ShaderRegexTTLLateWorldTransfer.Pattern]
; (?sx)
; dcl_constantbuffer\h+CB(?<scene_cb>\d+)\[\d+\],\h+immediateIndexed\n
; dcl_constantbuffer\h+CB(?<object_cb>\d+)\[4\],\h+immediateIndexed\n
; dcl_input\h+v(?<pos>\d+)\.xyz\n
; dcl_input\h+v(?<uv>\d+)\.xy\n
; dcl_output_siv\h+o(?<sv>\d+)\.xyzw,\h+position\n
; dcl_output\h+o(?<uv0>\d+)\.xy\n
; dcl_output\h+o(?<uv1>\d+)\.xyzw\n
; dcl_temps\h+\d+\n
; mul\h+r(?<local>\d+)\.xyzw,\h+v\k<pos>\.yyyy,\h+cb\k<object_cb>\[\d+\]\.xyzw\n
; mad\h+r\k<local>\.xyzw,\h+cb\k<object_cb>\[\d+\]\.xyzw,\h+v\k<pos>\.xxxx,\h+r\k<local>\.xyzw\n
; mad\h+r\k<local>\.xyzw,\h+cb\k<object_cb>\[\d+\]\.xyzw,\h+v\k<pos>\.zzzz,\h+r\k<local>\.xyzw\n
; add\h+r\k<local>\.xyzw,\h+r\k<local>\.xyzw,\h+cb\k<object_cb>\[\d+\]\.xyzw\n
; mul\h+r(?<clip>\d+)\.xyzw,\h+r\k<local>\.yyyy,\h+cb\k<scene_cb>\[\d+\]\.xyzw\n
; mad\h+r\k<clip>\.xyzw,\h+cb\k<scene_cb>\[\d+\]\.xyzw,\h+r\k<local>\.xxxx,\h+r\k<clip>\.xyzw\n
; mad\h+r\k<clip>\.xyzw,\h+cb\k<scene_cb>\[\d+\]\.xyzw,\h+r\k<local>\.zzzz,\h+r\k<clip>\.xyzw\n
; mad\h+o\k<sv>\.xyzw,\h+cb\k<scene_cb>\[\d+\]\.xyzw,\h+r\k<local>\.wwww,\h+r\k<clip>\.xyzw\n
; mov\h+o\k<uv0>\.xy,\h+v\k<uv>\.xyxx\n
; mov\h+o\k<uv1>\.xyzw,\h+l\(0,\h*0,\h*0,\h*0\)\n
; ret

[CommandListProbeLateWorldFlip]
if $enabled && $has_pending_layer
    if INDEX_COUNT == 6 && oD !== null
        if ps-t0 !== null && ps-t1 !== null && ps-t2 !== null
            if ps-t3 !== null && ps-t4 !== null && ps-t5 !== null
                run = CustomShaderLateWorldFlipDetect
            endif
        endif
    endif
endif

; Execute the matched native VS against its own quad once, intercept its output
; in a tiny GS, and encode the clip-Y/UV-Y relationship into a 1x1 texture.
; This measures the actual transfer orientation instead of guessing from the
; destination viewport or from the current game screen.
[CustomShaderLateWorldFlipDetect]
ResourceLateWorldProbeTarget = ref o0
ResourceLateWorldProbeDepth = ref oD
run = BuiltInCommandListUnbindAllRenderTargets
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
alpha_to_coverage = 0
sample_mask = ffffffff
gs = Shaders\LateWorldFlipDetect.hlsl
ps = Shaders\LateWorldFlipDetect.hlsl
o0 = set_viewport no_view_cache ResourceWorldRTFlip
topology = triangle_list
drawindexed = auto
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceLateWorldProbeTarget
oD = ref ResourceLateWorldProbeDepth
ResourceLateWorldProbeTarget = null
ResourceLateWorldProbeDepth = null

[CommandListProbeLateWorldTransfer]
if $enabled && $has_pending_layer
    if INDEX_COUNT == 6 && oD !== null
        if ps-t0 !== null && ps-t1 !== null && ps-t2 !== null
            if ps-t3 !== null && ps-t4 !== null && ps-t5 !== null
                run = CommandListApplyLateWorldComposite
            endif
        endif
    endif
endif

[CommandListApplyLateWorldComposite]
ResourceLateWorldTarget = ref o0
ResourceLateWorldDepth = ref oD
if ResourceLateWorldTarget !== null
    run = CommandListPushParams
    run = CommandListApplyParams
    run = BuiltInCommandListUnbindAllRenderTargets
    o0 = set_viewport no_view_cache ResourceLateWorldTarget
    ps-t29 = ResourceWorldRTFlip
    if $back_render
        run = CustomShaderLateWorldBack
    endif
    run = CustomShaderLateWorldFront
    ps-t29 = null
    run = BuiltInCommandListUnbindAllRenderTargets
    o0 = ref ResourceLateWorldTarget
    oD = ref ResourceLateWorldDepth
    run = CommandListPopParams
    $has_pending_layer = 0
    $has_mesh_mask = 0
    $mesh_mask_ready = 0
    $drawn = 1
    $diag_openworld = $diag_openworld + 1
    $frame_openworld = 1
    $frame_late_world = 1
endif
ResourceLateWorldTarget = null
ResourceLateWorldDepth = null

[CustomShaderLateWorldBack]
vs = Shaders\LateWorldComposite.hlsl
hs = null
ds = null
gs = null
ps = Shaders\LateWorldComposite.hlsl
cs = null
blend = ADD SRC_ALPHA INV_SRC_ALPHA
alpha = ADD ZERO ONE
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
run = CommandListBindBackLayer
draw = 3, 0
run = CommandListUnbindLayer

[CustomShaderLateWorldFront]
vs = Shaders\LateWorldComposite.hlsl
hs = null
ds = null
gs = null
ps = Shaders\LateWorldComposite.hlsl
cs = null
blend = ADD SRC_ALPHA INV_SRC_ALPHA
alpha = ADD ZERO ONE
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
run = CommandListBindFrontLayer
draw = 3, 0
run = CommandListUnbindLayer

; Agent Select is a separate render graph: applying at the general late UI
; consumer places TTL after the character and makes it draw through itself.
; The color+mask pair only marks the Agent Select graph. It is intentionally not
; allowed to consume pending: earlier mask/resolve quads retain stale ps slots.
; The actual application point is the semantic native portrait-transfer VS.
[TextureOverrideTTLAgentSelectPortraitMask]
; Agent Select portrait mask render target resource hash.
hash = fb295a37
filter_index = 86295.37
match_priority = 100
if $enabled && $has_pending_layer && INDEX_COUNT == 6
    $agent_select_context = 1
endif

[TextureOverrideTTLAgentSelectPortraitColor]
; Agent Select portrait color render target resource hash.
hash = bf0dd384
filter_index = 86295.36
match_priority = 100
if $enabled && $has_pending_layer
    if $agent_select_resolve_probe && DRAW_TYPE == 1 && VERTEX_COUNT == 3 && o0 == 86295.36 && o1 !== null && ps-t3 == 86295.36
        $agent_select_resolve_ready = 1
    elif INDEX_COUNT == 6
        $agent_select_context = 1
        if $agent_select_resolve_ready
            post run = CommandListApplyAgentSelectResolve
        endif
    endif
endif

; TAA and NO-AA do not create the SMAA mask/blur/portrait-transfer chain.
; Their shared native path resolves the character with this exact fullscreen
; triangle VS, then immediately returns it through a six-index quad before
; redrawing the body. Probe only ps-t2 while it is active; the color override
; validates the two color inputs, two outputs and Draw(3).
[ShaderOverrideTTLAgentSelectResolveProbe]
; Native Agent Select portrait color/mask resolve pixel shader.
hash = c85e3fc3d2f75d34
allow_duplicate_hash = true
run = CommandListProbeAgentSelectResolve

[CommandListProbeAgentSelectResolve]
if $enabled && $agent_select_context && $has_pending_layer && DRAW_TYPE == 1 && VERTEX_COUNT == 3
    $agent_select_resolve_probe = 1
    checktextureoverride = ps-t2
    $agent_select_resolve_probe = 0
endif

; Exact native SMAA portrait-transfer VS. The Agent Select context latch and
; six-index gate still prevent this shared shader from consuming elsewhere.
[ShaderOverrideTTLAgentSelectPortraitConsumer]
; Native SMAA portrait-transfer vertex shader used by Agent Select.
hash = 44d4fe4a0e71d3b8
allow_duplicate_hash = true
post run = CommandListApplyAgentSelect

[CommandListApplyAgentSelect]
if $enabled && $agent_select_context && $has_pending_layer && INDEX_COUNT == 6
    ResourceUITarget = ref o0
    if ResourceUITarget !== null
        run = CommandListPushParams
        run = CommandListApplyParams
        if $back_render
            run = CustomShaderAgentSelectBack
        endif
        run = CustomShaderAgentSelectFront
        run = CommandListPopParams
        $has_pending_layer = 0
        $has_mesh_mask = 0
        $mesh_mask_ready = 0
        $drawn = 1
        $diag_ui = $diag_ui + 1
        $frame_ui = 1
        $frame_agent_select = 1
        $agent_select_resolve_ready = 0
    endif
    ResourceUITarget = null
endif

; TAA/NO-AA return quads do not expose the SMAA portrait VB/IB contract. Draw a
; procedural triangle in the native viewport, then let the following body pass
; provide native occlusion.
[CommandListApplyAgentSelectResolve]
if $enabled && $agent_select_context && $agent_select_resolve_ready && $has_pending_layer && INDEX_COUNT == 6
    ResourceUITarget = ref o0
    if ResourceUITarget !== null
        run = CommandListPushParams
        run = CommandListApplyParams
        if $back_render
            run = CustomShaderAgentSelectResolveBack
        endif
        run = CustomShaderAgentSelectResolveFront
        run = CommandListPopParams
        $has_pending_layer = 0
        $has_mesh_mask = 0
        $mesh_mask_ready = 0
        $drawn = 1
        $diag_ui = $diag_ui + 1
        $frame_ui = 1
        $frame_agent_select = 1
        $agent_select_resolve_ready = 0
    endif
    ResourceUITarget = null
endif

[CustomShaderAgentSelectResolveBack]
vs = Shaders\NativeComposite.hlsl
hs = null
ds = null
gs = null
ps = Shaders\NativeComposite.hlsl
cs = null
blend = ADD SRC_ALPHA INV_SRC_ALPHA
alpha = ADD ONE INV_SRC_ALPHA
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
o0 = ref ResourceUITarget
run = CommandListBindBackLayer
draw = 3, 0
run = CommandListUnbindLayer

[CustomShaderAgentSelectResolveFront]
vs = Shaders\NativeComposite.hlsl
hs = null
ds = null
gs = null
ps = Shaders\NativeComposite.hlsl
cs = null
blend = ADD SRC_ALPHA INV_SRC_ALPHA
alpha = ADD ONE INV_SRC_ALPHA
depth_enable = false
stencil_enable = false
cull = none
topology = triangle_list
o0 = ref ResourceUITarget
run = CommandListBindFrontLayer
draw = 3, 0
run = CommandListUnbindLayer

[CustomShaderAgentSelectBack]
vs = Shaders\portrait_blit_vs.hlsl
hs = null
ds = null
gs = null
