[CustomShaderCaptureMaskBackObj]
ps = Shaders\CaptureMask.hlsl
cull = back
front = Clockwise
depth_clip_enable = true
depth_enable = true
depth_write_mask = zero
depth_func = greater_equal
stencil_enable = false
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
run = CommandListPrepare.Mask.B.Obj
