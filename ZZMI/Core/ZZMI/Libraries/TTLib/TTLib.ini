; Attached from GameHooks.ini by [ShaderRegexTTLLateWorldTransfer].
[CommandListProbeLateWorldFlip]
if $enabled && ($has_pending_layer || $has_pending_layer_obj)
    if INDEX_COUNT == 6 && oD !== null
        if ps-t0 !== null && ps-t1 !== null && ps-t2 !== null
            if ps-t3 !== null && ps-t4 !== null && ps-t5 !== null
                run = CustomShaderLateWorldFlipDetect
            endif
        endif
    endif
endif

; Execute the matched native VS against its own quad once, intercept its output
; in a tiny GS, and encode the clip-Y/UV-Y relationship into a 1x1 texture.
; This measures the actual transfer orientation instead of guessing from the
; destination viewport or from the current game screen.
[CustomShaderLateWorldFlipDetect]
ResourceLateWorldProbeTarget = ref o0
ResourceLateWorldProbeDepth = ref oD
run = BuiltInCommandListUnbindAllRenderTargets
blend = ADD ONE ZERO
alpha = ADD ONE ZERO
alpha_to_coverage = 0
sample_mask = ffffffff
gs = Shaders\LateWorldFlipDetect.hlsl
ps = Shaders\LateWorldFlipDetect.hlsl
o0 = set_viewport no_view_cache ResourceWorldRTFlip
topology = triangle_list
drawindexed = auto
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceLateWorldProbeTarget
oD = ref ResourceLateWorldProbeDepth
ResourceLateWorldProbeTarget = null
ResourceLateWorldProbeDepth = null

[CommandListProbeLateWorldTransfer]
if $enabled && ($has_pending_layer || $has_pending_layer_obj)
    if INDEX_COUNT == 6 && oD !== null
        if ps-t0 !== null && ps-t1 !== null && ps-t2 !== null
            if ps-t3 !== null && ps-t4 !== null && ps-t5 !== null
                run = CommandListApplyLateWorldComposite
            endif
        endif
    endif
endif

; Composites whichever pending layer(s) are open onto the matched native
; world-transfer draw's own target. Object first, then character, both as
; independent push/apply/draw/pop cycles onto the same target — see the
; layer_obj_*/Obj resource comments above for why they cannot share a cycle.
[CommandListApplyLateWorldComposite]
ResourceLateWorldTarget = ref o0
ResourceLateWorldDepth = ref oD
if ResourceLateWorldTarget !== null
    run = BuiltInCommandListUnbindAllRenderTargets
    o0 = set_viewport no_view_cache ResourceLateWorldTarget
    ps-t29 = ResourceWorldRTFlip

    if $has_pending_layer_obj
        run = CommandListPushParams
        run = CommandListApplyParamsObj
        if $layer_obj_back_render
            run = CustomShaderLateWorldBackObj
        endif
        run = CustomShaderLateWorldFrontObj
        run = CommandListPopParams
        $has_pending_layer_obj = 0
        $diag_openworld = $diag_openworld + 1
        $frame_openworld = 1
        $frame_late_world = 1
    endif

    if $has_pending_layer
        run = CommandListPushParams
        run = CommandListApplyParams
        if $layer_back_render
            run = CustomShaderLateWorldBack
        endif
        run = CustomShaderLateWorldFront
        run = CommandListPopParams
        $has_pending_layer = 0
        $has_mesh_mask = 0
        $mesh_mask_ready = 0
        $drawn = 1
        $diag_openworld = $diag_openworld + 1
        $frame_openworld = 1
        $frame_late_world = 1
    endif

    ps-t29 = null
    run = BuiltInCommandListUnbindAllRenderTargets
    o0 = ref ResourceLateWorldTarget
    oD = ref ResourceLateWorldDepth
endif
ResourceLateWorldTarget = null
ResourceLateWorldDepth = null

