; ============================================================================
; TTLib — game hooks
;
; Every point where the library attaches to this specific game build lives in
; this file and nowhere else. TTLib.ini contains only the engine: capture,
; layer lifetime, composition and the public API. If a game update breaks the
; library, the break is here.
;
; A hook declares WHERE to attach and WHEN the attachment is valid. It never
; contains composition logic: each one only hands control to a CommandList in
; TTLib.ini, and those command lists re-check their own runtime guards, so a
; hook that fires in the wrong place cannot by itself produce a draw.
;
; Two kinds appear here, and the difference matters when updating:
;
;   ShaderRegex   matches a semantic fingerprint of the shader's data flow.
;                 Survives register renumbering and constant-buffer index
;                 changes, so it usually survives a patch.
;   Exact hash    matches one compiled shader or resource. Cheap and precise,
;                 but a recompile on the game's side silently stops matching:
;                 the symptom is a layer that is captured and never applied.
;
; Runtime guards such as INDEX_COUNT, DRAW_TYPE and bound-target checks are part
; of a hook's contract, not optimisations. Several of these shaders are reused
; at other points in the frame, and the guards are what separate the intended
; use from the others.
; ============================================================================

namespace = TTL

; ---------------------------------------------------------------------------
; Capture-side classification
;
; Consulted by the core before every legacy capture. Setting
; $edge_case_skip_capture suppresses only the TTL capture: the game's own draw
; is left untouched, SceneDepth is not re-pointed and nothing is skipped.
; ---------------------------------------------------------------------------

; Agent Screen shadow/depth pass. The paired VS is 85be73aeb8e0d1d4, but the
; installed AgentSelect tool declares that hash with allow_duplicate_hash =
; overrule. Mark the same pass through its dedicated PS instead.
;
; The game submits character components here as monolithic draws. Resolve each
; bound IB through its existing TextureOverride so mod command lists expose
; their individual submesh draws. Ordinary drawindexed calls keep rendering;
; only calls routed through CommandList\TTL\Draw are suppressed below.
[ShaderOverrideTTLAgentScreenShadowPS]
; Agent Screen shadow-only pixel shader used by the selective TTL exclusion.
hash = 21929a7b958ca066
allow_duplicate_hash = true
filter_index = 770079
checktextureoverride = ib

[CommandListGameHooks.Classify]
$edge_case_skip_capture = 0
if ps == 770079
    $edge_case_skip_capture = 1
endif

; ---------------------------------------------------------------------------
; World consumer
; ---------------------------------------------------------------------------

; Late world backend. This semantic VS fingerprint covers the final 3D transfer
; used by 1da in the reference build without depending on that PS hash. The VS
; is reused earlier and in menus, so runtime guards require the final transfer's
; indexed quad, bound depth target and six PS inputs. Running after the native
; draw places TTL after the world effect chain but before UI.
[ShaderRegexTTLLateWorldTransfer]
shader_model = vs_4_0
run = CommandListProbeLateWorldFlip
post run = CommandListProbeLateWorldTransfer

[ShaderRegexTTLLateWorldTransfer.Pattern]
(?sx)
dcl_constantbuffer\h+CB(?<scene_cb>\d+)\[\d+\],\h+immediateIndexed\n
dcl_constantbuffer\h+CB(?<object_cb>\d+)\[4\],\h+immediateIndexed\n
dcl_input\h+v(?<pos>\d+)\.xyz\n
dcl_input\h+v(?<uv>\d+)\.xy\n
dcl_output_siv\h+o(?<sv>\d+)\.xyzw,\h+position\n
dcl_output\h+o(?<uv0>\d+)\.xy\n
dcl_output\h+o(?<uv1>\d+)\.xyzw\n
dcl_temps\h+\d+\n
mul\h+r(?<local>\d+)\.xyzw,\h+v\k<pos>\.yyyy,\h+cb\k<object_cb>\[\d+\]\.xyzw\n
mad\h+r\k<local>\.xyzw,\h+cb\k<object_cb>\[\d+\]\.xyzw,\h+v\k<pos>\.xxxx,\h+r\k<local>\.xyzw\n
mad\h+r\k<local>\.xyzw,\h+cb\k<object_cb>\[\d+\]\.xyzw,\h+v\k<pos>\.zzzz,\h+r\k<local>\.xyzw\n
add\h+r\k<local>\.xyzw,\h+r\k<local>\.xyzw,\h+cb\k<object_cb>\[\d+\]\.xyzw\n
mul\h+r(?<clip>\d+)\.xyzw,\h+r\k<local>\.yyyy,\h+cb\k<scene_cb>\[\d+\]\.xyzw\n
mad\h+r\k<clip>\.xyzw,\h+cb\k<scene_cb>\[\d+\]\.xyzw,\h+r\k<local>\.xxxx,\h+r\k<clip>\.xyzw\n
mad\h+r\k<clip>\.xyzw,\h+cb\k<scene_cb>\[\d+\]\.xyzw,\h+r\k<local>\.zzzz,\h+r\k<clip>\.xyzw\n
mad\h+o\k<sv>\.xyzw,\h+cb\k<scene_cb>\[\d+\]\.xyzw,\h+r\k<local>\.wwww,\h+r\k<clip>\.xyzw\n
mov\h+o\k<uv0>\.xy,\h+v\k<uv>\.xyxx\n
mov\h+o\k<uv1>\.xyzw,\h+l\(0,\h*0,\h*0,\h*0\)\n
ret

; ---------------------------------------------------------------------------
; Agent Select
; ---------------------------------------------------------------------------

; Agent Select is a separate render graph: applying at the general late UI
; consumer places TTL after the character and makes it draw through itself.
; The color+mask pair only marks the Agent Select graph. It is intentionally not
; allowed to consume pending: earlier mask/resolve quads retain stale ps slots.
; The actual application point is the semantic native portrait-transfer VS.
[TextureOverrideTTLAgentSelectPortraitMask]
; Agent Select portrait mask render target resource hash.
hash = fb295a37
filter_index = 86295.37
match_priority = 100
if $enabled && $has_pending_layer && INDEX_COUNT == 6
    $agent_select_context = 1
endif

[TextureOverrideTTLAgentSelectPortraitColor]
; Agent Select portrait color render target resource hash.
hash = bf0dd384
filter_index = 86295.36
match_priority = 100
if $enabled && $has_pending_layer
    if $agent_select_resolve_probe && DRAW_TYPE == 1 && VERTEX_COUNT == 3 && o0 == 86295.36 && o1 !== null && ps-t3 == 86295.36
        $agent_select_resolve_ready = 1
    elif INDEX_COUNT == 6
        $agent_select_context = 1
        if $agent_select_resolve_ready
            post run = CommandListApplyAgentSelectResolve
        endif
    endif
endif

; TAA and NO-AA do not create the SMAA mask/blur/portrait-transfer chain.
; Their shared native path resolves the character with this exact fullscreen
; triangle VS, then immediately returns it through a six-index quad before
; redrawing the body. Probe only ps-t2 while it is active; the color override
; validates the two color inputs, two outputs and Draw(3).

; TAA and NO-AA do not create the SMAA mask/blur/portrait-transfer chain.
; Their shared native path resolves the character with this exact fullscreen
; triangle VS, then immediately returns it through a six-index quad before
; redrawing the body. Probe only ps-t2 while it is active; the color override
; validates the two color inputs, two outputs and Draw(3).
[ShaderOverrideTTLAgentSelectResolveProbe]
; Native Agent Select portrait color/mask resolve pixel shader.
hash = c85e3fc3d2f75d34
allow_duplicate_hash = true
run = CommandListProbeAgentSelectResolve

; Exact native SMAA portrait-transfer VS. The Agent Select context latch and
; six-index gate still prevent this shared shader from consuming elsewhere.
[ShaderOverrideTTLAgentSelectPortraitConsumer]
; Native SMAA portrait-transfer vertex shader used by Agent Select.
hash = 44d4fe4a0e71d3b8
allow_duplicate_hash = true
post run = CommandListApplyAgentSelect

; ---------------------------------------------------------------------------
; Late UI consumer
; ---------------------------------------------------------------------------

; Confirmed universal late UI fallback, exact for the current game build. It
; does not modify the game shader; the override only attaches TTL's post command
; to the native compositor. The six-index runtime gate remains mandatory.
[ShaderOverrideTTLLateUIConsumer]
; Native UI portrait bridge pixel shader that creates the routed portrait RT.
hash = 6443f79de027d780
allow_duplicate_hash = true
if $enabled && $ui_placement_pending_count
    run = CommandListUIPlacement.Transfer
endif
post run = CommandListApplyNativeUI
